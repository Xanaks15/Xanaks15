name: WakaTime Stats Workflow

on:
  schedule:
    # Se ejecuta diariamente a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/wakatime.yml]

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check WakaTime configuration
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [ -z "$WAKATIME_API_KEY" ]; then
            echo "::error::Configure the WAKATIME_API_KEY repository secret before running this workflow."
            exit 1
          fi
      - uses: athul/waka-readme@8539bedb8277066fc9fe1b47d1f9b108eb866494 # v0.3.1
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SECTION_NAME: "wakatime"
          SHOW_TIME: "true"
          SHOW_TITLE: "true"
          BLOCKS: "░▒▓█"
          TIME_RANGE: "last_7_days"
          SHOW_TOTAL: "true"
